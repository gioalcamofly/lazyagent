name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12 (the engine the Rust tests run against)
        run: uv python install 3.12

      - name: Install the Python package
        run: uv sync --group dev

      - name: Software Vulkan (lavapipe) for the headless render tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Format
        working-directory: desktop
        run: cargo fmt --check

      - name: Clippy
        working-directory: desktop
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test (the Python engine and a Vulkan adapter are required)
        working-directory: desktop
        env:
          LAZYAGENT_PYTHON: ${{ github.workspace }}/.venv/bin/python
          LAZYAGENT_REQUIRE_ENGINE: "1"
          LAZYAGENT_REQUIRE_GPU: "1"
        run: cargo test --locked

  # The PyPI distributions (desktop app inside the platform wheels), built and
  # smoke-tested as artifacts. Nothing is published here: publish.yml does
  # that, on a v* tag only.
  wheels:
    uses: ./.github/workflows/wheels.yml
