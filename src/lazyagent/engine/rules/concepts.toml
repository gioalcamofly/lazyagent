# The hand-written part of "How lazyagent works" (proposal 0014, R6): short
# concept intros, the zones, the ball, the parts of a line, the colours and
# the keys. Everything about states, verbs, actions, kinds, facts and the
# user's rules is generated from the rules catalog (builtin.toml and the
# user's files), never written here.
#
# The desktop renders this as a page (Help → How lazyagent works, F1; `?` on
# Home opens it at "home"); `lazyagent rules doc --write` renders it as
# docs/guides/how-lazyagent-works.md. Keep the text short: cards and labels,
# not paragraphs.
#
# A section's `generated` names the catalog part drawn after its intro:
# overview (the diagram), zones, line, ball, states, kinds, keys, rules,
# facts. `example` is a code block shown after the intro. `screenshot` names a PNG of the desktop app (assets/how/<name>.png,
# regenerated by the desktop's screenshot test).
#
# Colours are theme names: yellow, orange, purple, cyan, blue, grey.

version = 1

[[section]]
id = "overview"
title = "How it fits together"
intro = "The engine watches. Agents work. The orchestrator helps. You decide."
generated = "overview"
cards = [
  { title = "Engine", text = "Owns the state: worktrees, agents, PRs, CI. Derives every line from facts. No LLM." },
  { title = "Agents", text = "Claude Code or Codex sessions, one or more per worktree. They work, ask and report." },
  { title = "Orchestrator", text = "An agent with a mandate: relays, re-runs CI, holds while it verifies. Never merges alone." },
  { title = "You", text = "Answer what blocks an agent, merge, decide. Home shows what needs you first." },
]

[[section]]
id = "home"
title = "Home"
intro = "One line per work item: a branch with its PR, its agents and its CI, or a teammate's PR that asks for your review. Nothing to keep up to date: the engine derives every line."
generated = "zones"
screenshot = "home"
caption = "Home: Now, the Round, To sit down with, In flight, and the Parked chip."

[[section]]
id = "line"
title = "Reading a line"
intro = "An inbox line starts with what to do (a verb); an In flight line with who has the ball."
generated = "line"
screenshot = "expanded"
caption = "An expanded line: the whole ask, its buttons, and since you looked."

[[section]]
id = "ball"
title = "The ball"
intro = "Who must move next. Only the ball you sees your inbox."
generated = "ball"

[[section]]
id = "decision"
title = "Decisions"
intro = "A brief is a question with options, a recommendation and evidence. Enter (or v) opens it."
screenshot = "decision"
caption = "The decision view: options on the left, evidence on the right."
cards = [
  { title = "Answer", text = "1-4 pick, Ctrl+Enter answers. It reaches the agent after its turn." },
  { title = "Explain this", text = "y: the owner agent explains in 10 lines; ⇧Y restores it first." },
  { title = "New brief", text = "b: ask for a better one, with a note." },
]

[[section]]
id = "park"
title = "Park, label, close"
intro = "Keep your inbox to what you can act on today."
screenshot = "park"
caption = "The park menu: until when, for this item or the whole work item."
cards = [
  { title = "Park  z", text = "1 h, tomorrow, a week, until something changes, indefinitely." },
  { title = "Label  l", text = "Who has the ball and why: others · QA." },
  { title = "Close  ⇧X", text = "Done or dropped; stops its agent. Never touches the worktree, branch or PR." },
  { title = "Undo", text = "x, z, d, ⇧O and ⇧D (deny) show Undo for 5 s (Ctrl+Z)." },
]

[[section]]
id = "orchestrator"
title = "The orchestrator"
intro = "A delegate with a mandate. The strip on top of Home says what it is doing, what it holds and what it did today."
screenshot = "strip"
caption = "The orchestrator strip: its report, its queue, today's actions, presence."
cards = [
  { title = "Pass  ⇧O", text = "Hand it an item for 2 h. It releases it with a note, or hands it back. Not for approvals, answers, reviews or merges: those stay yours." },
  { title = "Hold", text = "It holds a worker's branch while it verifies, then releases it to you." },
  { title = "Mandate", text = "Present: small reversible steps. Away: also reversible briefs, rebases, workers." },
  { title = "Never alone", text = "Merge, publish, force-push, delete unpushed work, close a PR: always yours." },
  { title = "Revert  ⇧U", text = "Undo its decision for a day: tells the agent, stops what it spawned." },
]

[[section]]
id = "states"
title = "Every state"
intro = "Each line's state comes from the first rule that matches, top to bottom. An unknown fact never matches."
generated = "states"

[[section]]
id = "kinds"
title = "Inbox items"
intro = "What can land in your inbox, at which level, and the verb it shows."
generated = "kinds"

[[section]]
id = "keys"
title = "Keys and actions"
intro = "Single letters act on the selected line. Shifted keys ask first or are bigger."
generated = "keys"

[[section]]
id = "why"
title = "Why is this line here?"
intro = "w on any Home line (or Why? in the expanded line) shows the rule that matched, the facts it read, and the rules above it that did not match."

[[section]]
id = "rules"
title = "Your rules"
intro = "Rules are data. Your global rules.toml and a repo's .lazyagent/rules.toml can add, replace or narrow the built-ins. A bad rule is skipped and the built-in stays."
generated = "rules"
example = '''
# $XDG_CONFIG_HOME/lazyagent/rules.toml
version = 1

[[rule]]
id = "merge"
says = "Merge only after QA."
and_when = 'tracker.qa == "tested"'
'''

[[section]]
id = "facts"
title = "Facts"
intro = "What rules can read. The engine fetches a costly fact only when an active rule reads it."
generated = "facts"

# --- Zones, top to bottom -------------------------------------------------

[[zone]]
id = "now"
name = "Now"
colour = "yellow"
text = "An agent is blocked on you: an approval, a question. Shown at once."

[[zone]]
id = "round"
name = "Round"
colour = "orange"
text = "Quick things that block nobody, and the reviews teammates asked of you. Delivered in rounds, so nothing moves under your cursor."

[[zone]]
id = "deep"
name = "To sit down with"
colour = "purple"
text = "Things to read: a brief, changes requested, a finished branch. Against your limit (deep_max). A deep item under a quicker line is a ↳ line of its own here: select it, Enter expands it on that item."

[[zone]]
id = "flight"
name = "In flight"
colour = "cyan"
text = "The ball is not yours: who has it and since when. Done rows fold at its end for a day."

[[zone]]
id = "parked"
name = "Parked"
colour = "purple"
text = "What you parked, folded until you open it (⇧Z). Says when it comes back."

# --- The ball -------------------------------------------------------------

[[ball]]
id = "you"
colour = "orange"
text = "In your inbox."

[[ball]]
id = "orchestrator"
colour = "cyan"
text = "You passed it, or it holds it while it verifies."

[[ball]]
id = "agent"
colour = "cyan"
text = "An agent works on it (directly, or delegated)."

[[ball]]
id = "others"
colour = "purple"
text = "A reviewer or a teammate (or your label says so)."

[[ball]]
id = "stalled"
colour = "yellow"
text = "Nobody runs and nothing moves."

[[ball]]
id = "done"
colour = "grey"
text = "Merged, closed, or already in the base branch."

# --- The parts of a line (the annotated example) ---------------------------

[line]
example = ["•", "▴", "cart-discount #12", "agent", "working · 12m · tests pass; opening the PR", "3m"]
parts = [
  { part = "•", text = "changed since you looked" },
  { part = "▴", text = "high priority (▾ low)" },
  { part = "cart-discount #12", text = "branch and PR" },
  { part = "agent", text = "who has the ball" },
  { part = "working · 12m · …", text = "the state: a fact, never a guess" },
  { part = "3m", text = "how long it has been like this" },
]

# --- Colours ----------------------------------------------------------------

[[colour]]
id = "orange"
text = "You: the ball is yours. Nothing else is orange."

[[colour]]
id = "yellow"
text = "Now, and parked items that still need you."

[[colour]]
id = "purple"
text = "To sit down with; your labels, parks and closes."

[[colour]]
id = "cyan"
text = "The orchestrator, and lines an agent works on."

[[colour]]
id = "blue"
text = "The selected line, and the • of a changed line."

[[colour]]
id = "grey"
text = "Facts and ages. Dimmed: done, or the next round."

# --- Keys -------------------------------------------------------------------
# `where`: home, decision, page (this page), why (the Why? view). The
# desktop's hint bar must name only keys listed here (a desktop test). A
# letter is written as it is typed: x is x, ⇧X is Shift+x.

[[key]]
keys = "j k ↓ ↑"
where = "home"
does = "Next / previous line"

[[key]]
keys = "Tab"
where = "home"
does = "Next line that needs you"

[[key]]
keys = "1 2 3 4"
where = "home"
does = "Jump to Now, Round, To sit down with, In flight (on a brief: pick an option)"

[[key]]
keys = "Enter"
where = "home"
does = "Expand (approve or answer there); open a brief (a ↳ brief: expand it)"

[[key]]
keys = "Esc"
where = "home"
does = "Close the form, else collapse"

[[key]]
keys = "a  ⇧D"
where = "home"
does = "On an approval: approve / deny (deny waits 5 s for Undo)"

[[key]]
keys = "Ctrl+Enter"
where = "home"
does = "On an expanded brief (or one opened with Answer here): answer"

[[key]]
keys = "v"
where = "home"
does = "The decision view"

[[key]]
keys = "y  ⇧Y"
where = "home"
does = "Explain this / restore its agent and explain"

[[key]]
keys = "w"
where = "home"
does = "Why is this line here?"

[[key]]
keys = "o"
where = "home"
does = "The agent's terminal"

[[key]]
keys = "n"
where = "home"
does = "Its session notes"

[[key]]
keys = "p"
where = "home"
does = "Its PR (or tracker task)"

[[key]]
keys = "x"
where = "home"
does = "Dismiss the item (Undo 5 s)"

[[key]]
keys = "z"
where = "home"
does = "Park: 1 h, tomorrow, a week, on change, indefinitely (1-5; w whole work item)"

[[key]]
keys = "⇧Z"
where = "home"
does = "Show / hide Parked"

[[key]]
keys = "⇧F"
where = "home"
does = "Show / hide done today"

[[key]]
keys = "⇧O"
where = "home"
does = "Pass to the orchestrator (Undo 5 s); not on what only you can do: approve, answer, decide, review, merge, confirm"

[[key]]
keys = "u"
where = "home"
does = "Take back a pass or hold; clear your label, park, close or delegation"

[[key]]
keys = "d"
where = "home"
does = "Delegate to the branch's agent (Undo 5 s); only what an agent can fix: CI red, a conflict, changes requested, a dead agent"

[[key]]
keys = "l"
where = "home"
does = "Label who has the ball"

[[key]]
keys = "⇧X"
where = "home"
does = "Close the work item and stop its agent (asks first)"

[[key]]
keys = "m  ⇧M"
where = "home"
does = "Mark seen / everything seen"

[[key]]
keys = "⇧U"
where = "home"
does = "Revert the orchestrator's decision (asks first)"

[[key]]
keys = "t"
where = "home"
does = "The orchestrator's actions today"

[[key]]
keys = "Ctrl+Z"
where = "home"
does = "Undo the last dismiss, park, delegate, pass or deny"

[[key]]
keys = "f"
where = "home"
does = "Fold In flight"

[[key]]
keys = "g w  g h"
where = "home"
does = "The worktrees / back to Home"

[[key]]
keys = "?"
where = "home"
does = "This page, at Home"

[[key]]
keys = "1-4"
where = "decision"
does = "Pick an option"

[[key]]
keys = "Ctrl+Enter"
where = "decision"
does = "Answer"

[[key]]
keys = "]  ["
where = "decision"
does = "Next / previous evidence tab"

[[key]]
keys = "y  ⇧Y"
where = "decision"
does = "Explain this / restore its agent and explain"

[[key]]
keys = "b"
where = "decision"
does = "Request a new brief"

[[key]]
keys = "o"
where = "decision"
does = "The agent's terminal"

[[key]]
keys = "⇧U"
where = "decision"
does = "Revert the orchestrator's decision"

[[key]]
keys = "Esc"
where = "decision"
does = "Back to Home"

[[key]]
keys = "F1"
where = "page"
does = "Open this page (anywhere)"

[[key]]
keys = "Esc"
where = "page"
does = "Back to where you were"

[[key]]
keys = "Esc"
where = "why"
does = "Back to Home"
