[project]
name = "lazyagent"
version = "0.8.0"
description = "A Textual TUI for managing coding agents across git worktrees"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pyte>=0.8.0",
    "textual>=8.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
lazyagent = "lazyagent.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lazyagent"]

[dependency-groups]
dev = [
    "textual-dev",
    "pytest",
    "pytest-asyncio",
]
e2e = [
    "playwright>=1.48",
]

[tool.pytest.ini_options]
# perf tests are local-only and slow: `pytest -m perf` runs them.
addopts = "-m 'not perf'"
markers = [
    "e2e: browser tests (Playwright); skipped when Playwright or a browser is missing",
    "perf: performance tests against the ui-plan budgets; local only, run with -m perf",
]
