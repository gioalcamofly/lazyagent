[workspace]
resolver = "3"
members = ["crates/proto"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/gioalcamofly/lazyagent"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sha1_smol = "1"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
